[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "germaneering-lab"
version = "1.0.0"
authors = [
    {name = "Germaneering Lab", email = "contacts@germaneering.org"},
]
description = "CLI explorations for Germaneering Lab"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research", 
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["haversine", "geosearoute", "cli", "education", "germaneering", "deep-code"]

# Minimal runtime dependencies
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    # Development tools (Python standard library compatible)
]

[project.urls] 
"Homepage" = "https://germaneering.org"
"Repository" = "https://github.com/germaneering/germaneering-lab"
"Bug Tracker" = "https://github.com/germaneering/germaneering-lab/issues"
"Documentation" = "https://germaneering.org"

[project.scripts]
haversine = "haversine.__main__:main"
geosearoute-cli = "geosearoute_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["haversine*", "geosearoute_cli*"]

[tool.setuptools.package-data]
haversine = ["*.md"]
geosearoute_cli = ["*.md"]

# Testing configuration  
[tool.coverage.run]
source = ["haversine", "geosearoute_cli"]
omit = ["tests/*", "**/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# UV-specific settings
[tool.uv]

# Documentation that this follows Germaneering principles
[tool.germaneering]
pillar = "deep-code"
principle = "awareness-beneath-abstraction"
educational-value = "demonstrates CLI patterns for mathematical and service-based explorations"
zero-dependencies = false